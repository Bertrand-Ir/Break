# Every push to main → signed APK → GitHub Release "build-<run number>".
# The app polls the latest release and offers a one-tap update when the build number is newer.
name: Build & Release

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v5

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.BREAK_KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.BREAK_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.BREAK_KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error title=Missing signing key::Add the BREAK_KEYSTORE_BASE64, BREAK_KEYSTORE_PASSWORD, BREAK_KEY_ALIAS and BREAK_KEY_PASSWORD repository secrets (see README → Releases & auto-update)."
            exit 1
          fi
          # Tolerate spaces / line breaks / CRs picked up while copy-pasting the secret.
          printf '%s' "$KEYSTORE_BASE64" | tr -d '[:space:]' > "$RUNNER_TEMP/ks.b64"
          echo "Secret length after cleanup: $(wc -c < "$RUNNER_TEMP/ks.b64") characters (expected 5704)"
          if ! base64 -d "$RUNNER_TEMP/ks.b64" > "$RUNNER_TEMP/break-release.jks" 2>/dev/null; then
            echo "::error title=Bad keystore secret::BREAK_KEYSTORE_BASE64 is not valid base64. Re-paste the full contents of keystore/break-release.jks.base64 (one long line)."
            exit 1
          fi
          if ! keytool -list -keystore "$RUNNER_TEMP/break-release.jks" -storepass "$STORE_PASS" -alias "$KEY_ALIAS" > /dev/null 2>&1; then
            echo "::error title=Keystore password or alias wrong::The keystore decoded, but BREAK_KEYSTORE_PASSWORD or BREAK_KEY_ALIAS doesn't match it."
            exit 1
          fi
          echo "Signing key OK"

      - name: Build signed APK
        env:
          BREAK_VERSION_CODE: ${{ github.run_number }}
          BREAK_REPO: ${{ github.repository }}
          BREAK_KEYSTORE: ${{ runner.temp }}/break-release.jks
          BREAK_KEYSTORE_PASSWORD: ${{ secrets.BREAK_KEYSTORE_PASSWORD }}
          BREAK_KEY_ALIAS: ${{ secrets.BREAK_KEY_ALIAS }}
          BREAK_KEY_PASSWORD: ${{ secrets.BREAK_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          mkdir -p dist
          cp app/build/outputs/apk/release/*.apk "dist/Break-1.0.${{ github.run_number }}.apk"

      - name: Release notes from commits
        run: |
          {
            jq -r '.commits[]? | "• " + (.message | split("\n")[0])' "$GITHUB_EVENT_PATH" 2>/dev/null
          } > notes.md || true
          if [ ! -s notes.md ]; then git log -1 --pretty='• %s' > notes.md; fi
          cat notes.md

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Break 1.0.${{ github.run_number }}
          body_path: notes.md
          files: dist/*.apk
          make_latest: "true"
